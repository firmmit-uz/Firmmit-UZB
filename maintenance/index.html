<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FIRMMIT | Tayyorgarlik ko'rilmoqda</title>
<link rel="icon" type="image/png" href="/maintenance/favicon.png">
<link rel="preload" as="image" href="/maintenance/poster-hq.jpg">
<style>
  /* Vaqtincha to'xtatish sahifasi.
     Poster butun ekranni qoplaydi (cover). Matn rasm markazida (eni 26–73%, bo'yi 19–81%),
     shuning uchun yotiq va kvadratga yaqin ekranlarda matn kesilmaydi.
     Tik ekranda (telefon) to'liq qoplash matnni kesadi: u yerda poster eni bo'yicha
     kattalashtiriladi (matn sig'adigan qilib), qolgan joyni xira fon to'ldiradi. */
  html, body { margin: 0; height: 100%; }
  body { background: #0f1218; overflow: hidden; }
  .bg { position: fixed; inset: -60px; background: url('/maintenance/poster-hq.jpg') center / cover no-repeat;
        filter: blur(30px) brightness(0.5); }
  .stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
           width: max(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  .stage img { display: block; width: 100%; height: 100%; }
  @media (max-aspect-ratio: 1/1) {
    .stage { width: 178vw; }   /* ekranda rasm enining o'rtadagi 56% i ko'rinadi — matn to'liq sig'adi */
  }
  @media (min-aspect-ratio: 27/10) {
    .stage { width: 177.78vh; }   /* juda past/keng oyna: bo'yi bo'yicha sig'dirish, yonlarini xira fon to'ldiradi */
  }
  /* rasmdagi telefon va email qatorlari ustidagi bosiladigan joylar (rasm koordinatalarida) */
  .hit { position: absolute; left: 26%; width: 48%; height: 9%; border-radius: 12px; }
  .hit:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .tel { top: 46.5%; }
  .mail { top: 57%; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="stage">
  <img src="/maintenance/poster-hq.jpg" width="1920" height="1080"
       alt="FIRMMIT, Korea No. 1 Smart Farm Company. Sayt tayyorlanmoqda. Telefon: +998 90 063 23 15. Email: global@firmmit.com">
  <a class="hit tel" href="tel:+998900632315" aria-label="Qo'ng'iroq qilish: +998 90 063 23 15"></a>
  <a class="hit mail" href="mailto:global@firmmit.com" aria-label="Email yozish: global@firmmit.com"></a>
</main>
</body>
</html>
